# timezone.mkado.dev — the TimeZone.tools front-end (artifacts/timetools) as a static SPA.
# Built on the workstation by mkado-dev/deploy.sh (`./deploy.sh timezone`), uploaded to
# /var/www/timezone. Installed with `./deploy.sh timezone --nginx`.
server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name timezone.mkado.dev;
    root /var/www/timezone;
    index index.html;

    ssl_certificate     /etc/ssl/cloudflare/mkado.dev.pem;
    ssl_certificate_key /etc/ssl/cloudflare/mkado.dev.key;
    include /etc/nginx/snippets/cloudflare-realip.conf;
    include /etc/nginx/snippets/security-headers.conf;

    # hashed build output: cache for a year
    location /assets/ { expires 1y; add_header Cache-Control "public, immutable"; include /etc/nginx/snippets/security-headers.conf; }
    # translations are fetched at runtime (i18next-http-backend); short cache
    location /locales/ { expires 1h; add_header Cache-Control "public"; include /etc/nginx/snippets/security-headers.conf; }
    # client-side routes (wouter)
    location / { try_files $uri $uri/ /index.html; }
}

server {
    listen 80;
    listen [::]:80;
    server_name timezone.mkado.dev;
    return 301 https://$host$request_uri;
}
